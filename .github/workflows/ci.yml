name: ci

# Pull requests only: opening a PR and every push to its head branch run CI. A push to a branch
# with no open PR, and a merge to main, run nothing.
on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads rust-toolchain.toml (channel + components) and caches the build.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit and property tests
        run: cargo test --locked --workspace
      # The binary's e2e-hooks feature (its crash points, the E2E suite's sources): the two steps
      # above build without it, and the e2e test target requires it.
      - name: Clippy (e2e-hooks)
        run: cargo clippy --locked -p data-avalanche --features e2e-hooks --all-targets -- -D warnings
      - name: Unit tests (e2e-hooks)
        run: cargo test --locked -p data-avalanche --features e2e-hooks --lib
      # The example alert rules against their promtool tests (M10); the catalogue test checks
      # the series they name.
      - name: Alert rules
        run: >-
          docker run --rm -v "$PWD/deploy/prometheus:/rules:ro" --entrypoint promtool
          prom/prometheus:v3.15.0 test rules /rules/alerts.test.yaml
      # The Helm chart (M11a): lint, render with its example values, and validate the objects
      # against the Kubernetes API's schemas; packaging.rs validates the example's config.
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Helm chart
        run: |
          chart=deploy/helm/data-avalanche
          for values in "$chart"/ci/*-values.yaml; do
            helm lint --strict "$chart" -f "$values"
            helm template ci "$chart" -f "$values" \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -kubernetes-version 1.37.0 -
          done
          # The API's TLS turns the probes to HTTPS.
          [ "$(helm template ci "$chart" -f "$chart/ci/tls-values.yaml" | grep -c 'scheme: HTTPS')" = 3 ]
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -no-color
      # RustSec advisory audit of Cargo.lock. Non-blocking by design: a vulnerable dependency is
      # reported (warning annotation + failed step) but never fails the job.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Security audit (non-blocking)
        continue-on-error: true
        run: |
          cargo audit || { echo "::warning::cargo audit reported RustSec advisories (non-blocking) - see this step's log"; exit 1; }

  # Integration tests: DB containers + S3/Azure emulators (test-infra/compose.yaml) + a REAL GCS bucket.
  # Requirements (documented in test-infra/README.md, "CI requirements"):
  #   secrets.GCP_SA_KEY           service-account key JSON with roles/storage.objectAdmin on the bucket
  #   vars.DATA_AVALANCHE_GCS_BUCKET    CI bucket name (versioning off, lifecycle rule on data-avalanche-it/)
  # Fork PRs skip GCS (DATA_AVALANCHE_SKIP_GCS=1) with a notice when the secret/variable is unavailable.
  # On a same-repository PR, a missing secret/variable fails the job.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    env:
      DATA_AVALANCHE_IT: "1"
      DATA_AVALANCHE_GCS_BUCKET: ${{ vars.DATA_AVALANCHE_GCS_BUCKET }}
    steps:
      # The workspace's test build and then the E2E build don't fit on the runner's disk beside
      # its preinstalled SDKs, which nothing here uses.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: GCS credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -z "$GCP_SA_KEY" ] || [ -z "$DATA_AVALANCHE_GCS_BUCKET" ]; then
            if [ "$IS_FORK_PR" = "true" ]; then
              echo "::notice::GCP_SA_KEY or DATA_AVALANCHE_GCS_BUCKET unavailable (fork PR) - GCS tests skipped"
              echo "DATA_AVALANCHE_SKIP_GCS=1" >> "$GITHUB_ENV"
            else
              echo "::error::GCP_SA_KEY secret or DATA_AVALANCHE_GCS_BUCKET variable is not configured (see test-infra/README.md \"CI requirements\")"
              exit 1
            fi
          else
            umask 077
            printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcs-key.json"
            echo "GOOGLE_SERVICE_ACCOUNT_PATH=$RUNNER_TEMP/gcs-key.json" >> "$GITHUB_ENV"
          fi
      # uv runs the DuckDB cross-read of the Delta sink (R-12, crates/data-avalanche-sink-delta).
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Start test infrastructure
        run: test-infra/up.sh
      - name: Integration tests
        run: cargo test --locked --workspace -- --test-threads=1
      # The MySQL source on its other per-change targets (P-8; the run above reads mysql-84):
      # file/position mode on MySQL 8.4, and MariaDB 11.8 in GTID and file/position mode.
      - name: MySQL source, other targets
        run: |
          for target in mysql-84-nogtid mariadb-118 mariadb-118-binlog; do
            DATA_AVALANCHE_MYSQL=$target cargo test --locked -p data-avalanche-source-mysql --tests
          done
      # The slice-1 E2E suite (roadmap §5.3): the binary as a process, built with its crash points.
      - name: Slice-1 E2E
        run: cargo test --locked -p data-avalanche --features e2e-hooks --test e2e -- --test-threads=1
      - name: Container logs on failure
        if: failure()
        run: docker compose -f test-infra/compose.yaml logs --no-color
      - name: Stop test infrastructure
        if: always()
        run: test-infra/down.sh
      - name: Remove GCS key
        if: always()
        run: rm -f "$RUNNER_TEMP/gcs-key.json"

  # The slice-1 E2E suite on MySQL and MariaDB (Q-M7b-1, Q-M7b-2), one job per target beside the
  # integration job: MySQL 8.4 in GTID and file/position mode, MariaDB 11.8 in GTID mode (its
  # file/position mode, and MariaDB 11.4 and 10.11, run in weekly.yml). The failover scenario on
  # mysql-84-nogtid fails over to mysql-84, so mysql-84 runs in every job. No secrets.
  e2e-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    strategy:
      fail-fast: false
      matrix:
        target: [mysql-84, mysql-84-nogtid, mariadb-118]
    env:
      DATA_AVALANCHE_IT: "1"
      DATA_AVALANCHE_SKIP_GCS: "1"
      DATA_AVALANCHE_E2E_SOURCE: mysql
      DATA_AVALANCHE_MYSQL: ${{ matrix.target }}
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # uv runs the type scenario's DuckDB read.
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Start ${{ matrix.target }}, mysql-84, RustFS and Jaeger
        run: |
          docker compose -f test-infra/compose.yaml up -d --wait "${{ matrix.target }}" mysql-84 rustfs jaeger
          docker compose -f test-infra/compose.yaml --profile init run --rm rustfs-init
      - name: Slice-1 E2E
        run: cargo test --locked -p data-avalanche --features e2e-hooks --test e2e -- --test-threads=1
      - name: Container logs on failure
        if: failure()
        run: docker compose -f test-infra/compose.yaml logs --no-color "${{ matrix.target }}" mysql-84 rustfs jaeger
      - name: Stop the containers
        if: always()
        run: docker compose -f test-infra/compose.yaml down -v

  # The smoke deploy (M11a): the image built from deploy/docker/Dockerfile, imported into
  # test-infra's k3s, and the Helm chart's three pods running a pipeline from PostgreSQL 18 into
  # RustFS; a deleted pod hands the pipeline to the others. No secrets.
  k3s:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: check
    env:
      DATA_AVALANCHE_IT: "1"
      DATA_AVALANCHE_SKIP_GCS: "1"
      DATA_AVALANCHE_K3S: "1"
      KUBECONFIG: ${{ github.workspace }}/test-infra/.k3s/kubeconfig.yaml
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: docker/setup-buildx-action@v4
      - name: Start PostgreSQL 18 and RustFS
        run: |
          docker compose -f test-infra/compose.yaml up -d --wait postgres-18 rustfs
          docker compose -f test-infra/compose.yaml --profile init run --rm rustfs-init
      - name: The image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          tags: data-avalanche:k3s
          load: true
          # The gha cache holds the layers only: a change under crates/ builds the binary cold.
          cache-from: type=gha,scope=k3s
          cache-to: type=gha,mode=max,scope=k3s
      # rustls's platform verifier reads the distroless CA bundle: S3, GCS and Azure over TLS.
      - name: The image's CA bundle
        run: |
          id=$(docker create data-avalanche:k3s)
          docker cp "$id:/etc/ssl/certs/ca-certificates.crt" - | tar -tv
          docker rm "$id"
      - name: Start k3s, import the image
        run: test-infra/k3s.sh --no-build
      - name: The smoke deploy
        run: >-
          cargo test --locked -p data-avalanche --features e2e-hooks --test e2e --
          k3s:: --test-threads=1
      - name: Pods and logs on failure
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl logs -l app.kubernetes.io/name=data-avalanche --prefix --tail=200 || true
      - name: Stop the containers
        if: always()
        run: docker compose -f test-infra/compose.yaml --profile k3s down -v
