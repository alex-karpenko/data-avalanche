name: ci

# Pull requests only: opening a PR and every push to its head branch run CI. A push to a branch
# with no open PR, and a merge to main, run nothing.
on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads rust-toolchain.toml (channel + components) and caches the build.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit and property tests
        run: cargo test --locked --workspace
      # The binary's e2e-hooks feature (its crash points, the E2E suite's sources): the two steps
      # above build without it, and the e2e test target requires it.
      - name: Clippy (e2e-hooks)
        run: cargo clippy --locked -p data-avalanche --features e2e-hooks --all-targets -- -D warnings
      - name: Unit tests (e2e-hooks)
        run: cargo test --locked -p data-avalanche --features e2e-hooks --lib
      # RustSec advisory audit of Cargo.lock. Non-blocking by design: a vulnerable dependency is
      # reported (warning annotation + failed step) but never fails the job.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Security audit (non-blocking)
        continue-on-error: true
        run: |
          cargo audit || { echo "::warning::cargo audit reported RustSec advisories (non-blocking) - see this step's log"; exit 1; }

  # Integration tests: DB containers + S3/Azure emulators (test-infra/compose.yaml) + a REAL GCS bucket.
  # Requirements (documented in test-infra/README.md, "CI requirements"):
  #   secrets.GCP_SA_KEY           service-account key JSON with roles/storage.objectAdmin on the bucket
  #   vars.DATA_AVALANCHE_GCS_BUCKET    CI bucket name (versioning off, lifecycle rule on data-avalanche-it/)
  # Fork PRs skip GCS (DATA_AVALANCHE_SKIP_GCS=1) with a notice when the secret/variable is unavailable.
  # On a same-repository PR, a missing secret/variable fails the job.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    env:
      DATA_AVALANCHE_IT: "1"
      DATA_AVALANCHE_GCS_BUCKET: ${{ vars.DATA_AVALANCHE_GCS_BUCKET }}
    steps:
      # The workspace's test build and then the E2E build don't fit on the runner's disk beside
      # its preinstalled SDKs, which nothing here uses.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: GCS credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -z "$GCP_SA_KEY" ] || [ -z "$DATA_AVALANCHE_GCS_BUCKET" ]; then
            if [ "$IS_FORK_PR" = "true" ]; then
              echo "::notice::GCP_SA_KEY or DATA_AVALANCHE_GCS_BUCKET unavailable (fork PR) - GCS tests skipped"
              echo "DATA_AVALANCHE_SKIP_GCS=1" >> "$GITHUB_ENV"
            else
              echo "::error::GCP_SA_KEY secret or DATA_AVALANCHE_GCS_BUCKET variable is not configured (see test-infra/README.md \"CI requirements\")"
              exit 1
            fi
          else
            umask 077
            printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcs-key.json"
            echo "GOOGLE_SERVICE_ACCOUNT_PATH=$RUNNER_TEMP/gcs-key.json" >> "$GITHUB_ENV"
          fi
      # uv runs the DuckDB cross-read of the Delta sink (R-12, crates/data-avalanche-sink-delta).
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Start test infrastructure
        run: test-infra/up.sh
      - name: Integration tests
        run: cargo test --locked --workspace -- --test-threads=1
      # The slice-1 E2E suite (roadmap §5.3): the binary as a process, built with its crash points.
      - name: Slice-1 E2E
        run: cargo test --locked -p data-avalanche --features e2e-hooks --test e2e -- --test-threads=1
      - name: Container logs on failure
        if: failure()
        run: docker compose -f test-infra/compose.yaml logs --no-color
      - name: Stop test infrastructure
        if: always()
        run: test-infra/down.sh
      - name: Remove GCS key
        if: always()
        run: rm -f "$RUNNER_TEMP/gcs-key.json"
