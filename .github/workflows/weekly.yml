name: weekly

# The PostgreSQL source, the pipeline worker and the slice-1 E2E suite against the older supported
# servers (P-8, Q-M5-7, Q-M5-23, roadmap §4 M6b exit): PostgreSQL 14–17, one job each, the
# `postgres-18` suites of ci.yml re-run through DATA_AVALANCHE_PG_PORT. The E2E suite also needs
# RustFS and uv (its DuckDB read).
# The MySQL source against the older MariaDB LTS servers (P-8): 11.4 and 10.11, GTID mode, through
# DATA_AVALANCHE_MYSQL. The slice-1 E2E suite on MariaDB 11.8 in file/position mode and on 11.4
# and 10.11 (Q-M7b-2; ci.yml runs it on MySQL 8.4 and MariaDB 11.8 per change).
# Weekly (Mondays 03:41 UTC) and on manual dispatch. The TLS tests need `postgres-tls`
# (PostgreSQL 18) or `mysql-tls` (MySQL 8.4) and run in ci.yml only. The image is built on linux/arm64
# (M11a). No secrets.

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: [14, 15, 16, 17]
    env:
      DATA_AVALANCHE_IT: "1"
      DATA_AVALANCHE_SKIP_GCS: "1"
      DATA_AVALANCHE_PG_PORT: "554${{ matrix.version }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Start PostgreSQL ${{ matrix.version }}, RustFS and Jaeger
        run: |
          docker compose -f test-infra/compose.yaml --profile matrix up -d --wait "postgres-${{ matrix.version }}" rustfs jaeger
          docker compose -f test-infra/compose.yaml --profile init run --rm rustfs-init
      - name: PostgreSQL source tests
        run: 'cargo test --locked -p data-avalanche-source-pg --test pg --test slot_invalidation -- --test-threads=1 --skip tls::'
      - name: Pipeline worker tests
        run: cargo test --locked -p data-avalanche-pipeline --test pg --test sync_commit --test sync_drop -- --test-threads=1
      - name: Slice-1 E2E
        run: cargo test --locked -p data-avalanche --features e2e-hooks --test e2e -- --test-threads=1
      - name: Container logs on failure
        if: failure()
        run: docker compose -f test-infra/compose.yaml --profile matrix logs --no-color "postgres-${{ matrix.version }}" rustfs jaeger
      - name: Stop the containers
        if: always()
        run: docker compose -f test-infra/compose.yaml --profile matrix down -v

  mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [mariadb-114, mariadb-1011]
    env:
      DATA_AVALANCHE_IT: "1"
      DATA_AVALANCHE_SKIP_GCS: "1"
      DATA_AVALANCHE_MYSQL: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Start ${{ matrix.target }}
        run: docker compose -f test-infra/compose.yaml --profile matrix up -d --wait "${{ matrix.target }}"
      # The TLS tests skip themselves off the mysql-84 target.
      - name: MySQL source tests
        run: cargo test --locked -p data-avalanche-source-mysql --tests
      - name: Container logs on failure
        if: failure()
        run: docker compose -f test-infra/compose.yaml --profile matrix logs --no-color "${{ matrix.target }}"
      - name: Stop the containers
        if: always()
        run: docker compose -f test-infra/compose.yaml --profile matrix down -v

  e2e-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: mariadb-118-binlog, service: mariadb-118 }
          - { target: mariadb-114, service: mariadb-114 }
          - { target: mariadb-1011, service: mariadb-1011 }
    env:
      DATA_AVALANCHE_IT: "1"
      DATA_AVALANCHE_SKIP_GCS: "1"
      DATA_AVALANCHE_E2E_SOURCE: mysql
      DATA_AVALANCHE_MYSQL: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Start ${{ matrix.service }}, RustFS and Jaeger
        run: |
          docker compose -f test-infra/compose.yaml --profile matrix up -d --wait "${{ matrix.service }}" rustfs jaeger
          docker compose -f test-infra/compose.yaml --profile init run --rm rustfs-init
      - name: Slice-1 E2E
        run: cargo test --locked -p data-avalanche --features e2e-hooks --test e2e -- --test-threads=1
      - name: Container logs on failure
        if: failure()
        run: docker compose -f test-infra/compose.yaml --profile matrix logs --no-color "${{ matrix.service }}" rustfs jaeger
      - name: Stop the containers
        if: always()
        run: docker compose -f test-infra/compose.yaml --profile matrix down -v

  # The image on linux/arm64 (Q-M11-3), built on an arm64 runner as the release builds it, so a
  # break shows before a tag; PR CI's k3s job builds linux/amd64. Nothing is pushed.
  image-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          tags: data-avalanche:arm64
          load: true
          cache-from: type=gha,scope=linux/arm64
          cache-to: type=gha,mode=max,scope=linux/arm64
      - name: The binary runs
        run: docker run --rm data-avalanche:arm64 --version
