# Local sources for the source-capability probes. Non-default host ports to avoid clashes.
#   docker compose up -d --wait     /     docker compose down -v
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: probe
      POSTGRES_DB: probe
    command: >
      postgres -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
               -c logical_decoding_work_mem=64kB
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probe -d probe"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: probe
      MYSQL_DATABASE: probe
    command: >
      --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --binlog-row-image=FULL
      --binlog-row-metadata=FULL --gtid-mode=ON --enforce-gtid-consistency=ON
    ports: ["53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pprobe"]
      interval: 2s
      retries: 60

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: probe
      MARIADB_DATABASE: probe
    command: >
      --server-id=1 --log-bin=mariadb-bin --binlog-format=ROW --binlog-row-image=FULL
      --binlog-row-metadata=FULL
    ports: ["53307:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  # S-MY10 (file/position mode): MySQL 8.4 with GTID off, the server `replication_type: binlog`
  # exists for.
  mysql-nogtid:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: probe
      MYSQL_DATABASE: probe
    command: >
      --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --binlog-row-image=FULL
      --binlog-row-metadata=FULL --gtid-mode=OFF
    ports: ["53308:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pprobe"]
      interval: 2s
      retries: 60

  # S-MY10 / S-MY11 on the MariaDB version v1 tests on every change (roadmap §5.2).
  mariadb-118:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: probe
      MARIADB_DATABASE: probe
    command: >
      --server-id=1 --log-bin=mariadb-bin --binlog-format=ROW --binlog-row-image=FULL
      --binlog-row-metadata=FULL --gtid-strict-mode=1
    ports: ["53309:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  # The oldest MariaDB the weekly matrix runs (roadmap §5.2).
  mariadb-1011:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: probe
      MARIADB_DATABASE: probe
    command: >
      --server-id=1 --log-bin=mariadb-bin --binlog-format=ROW --binlog-row-image=FULL
      --binlog-row-metadata=FULL --gtid-strict-mode=1
    ports: ["53310:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  # TLS-enabled PostgreSQL for S-PG8: a throwaway CA signs a server cert (CN/SAN localhost,
  # 127.0.0.1) at start — rustls rejects a self-signed cert used as its own CA (CaUsedAsEndEntity).
  # The CA is exported to ./.tls/ca.crt for the client's verify-full check.
  postgres-tls:
    image: postgres:17
    environment:
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: probe
      POSTGRES_DB: probe
    entrypoint:
      - sh
      - -c
      - >
        openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=probe-ca
        -keyout /tmp/ca.key -out /tmp/ca.crt 2>/dev/null
        && openssl req -newkey rsa:2048 -nodes -subj /CN=localhost
        -addext subjectAltName=DNS:localhost,IP:127.0.0.1
        -keyout /tmp/server.key -out /tmp/server.csr 2>/dev/null
        && openssl x509 -req -in /tmp/server.csr -CA /tmp/ca.crt -CAkey /tmp/ca.key -CAcreateserial
        -days 2 -copy_extensions copyall -out /tmp/server.crt 2>/dev/null
        && chown postgres /tmp/server.key /tmp/server.crt && chmod 600 /tmp/server.key
        && cp /tmp/ca.crt /tls/ca.crt
        && exec docker-entrypoint.sh postgres -c wal_level=logical -c ssl=on
        -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key
    volumes: ["./.tls:/tls"]
    ports: ["55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probe -d probe"]
      interval: 2s
      retries: 30
