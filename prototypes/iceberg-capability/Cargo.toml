[package]
name = "iceberg-capability"
version = "0.1.0"
edition = "2021"
publish = false
description = "Capability probe: proves the iceberg-rust behaviors the CDC sink/clustering design depends on (DA-SINK-1/2, DA-SCHEMA-8, DA-TYPE-5, DA-SINK-10)"

# MSRV: 1.92 (iceberg 0.9.1 — latest 0.9, edition 2024, per crates.io 2026-06).
#
# The iceberg-dependent probe code is gated behind the `probe` feature and is OFF
# by default, so the default `cargo build`/`cargo test` stays green. The probe test
# bodies are still SCAFFOLDS (`todo!()`) — they encode the test plan; the real
# iceberg-rust 0.9 writer/transaction/catalog calls remain to be implemented.
#
# Dependency notes (verified on crates.io):
#   - `iceberg-catalog-memory` is YANKED at every version (no 0.9) — the memory
#     catalog moved into the core `iceberg` crate (`iceberg::catalog::memory`).
#   - arrow is NOT pinned here: iceberg re-exports the exact arrow it builds
#     against, so the probe must use iceberg's arrow to avoid a version clash.

[dependencies]

[features]
# Enable to compile + run the real iceberg-rust probes. Self-contained: a
# MemoryCatalog over a temp local-fs warehouse (no cloud needed for G1–G4).
probe = [
    "dep:iceberg",
    "dep:tokio",
    "dep:tempfile",
    "dep:futures",
    "dep:anyhow",
]

[dependencies.anyhow]
version = "1"
optional = true

[dependencies.iceberg]
version = "0.9" # -> 0.9.1; must match the sink's iceberg dep. Provides MemoryCatalog + arrow re-export.
optional = true

[dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread"]
optional = true

[dependencies.tempfile]
version = "3"
optional = true

[dependencies.futures]
version = "0.3"
optional = true
