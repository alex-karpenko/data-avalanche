[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["prototypes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
data-avalanche-core = { path = "crates/data-avalanche-core" }
data-avalanche-config = { path = "crates/data-avalanche-config" }
data-avalanche-testkit = { path = "crates/data-avalanche-testkit" }
data-avalanche-storage = { path = "crates/data-avalanche-storage" }
data-avalanche-state = { path = "crates/data-avalanche-state" }
data-avalanche-pipeline = { path = "crates/data-avalanche-pipeline" }
data-avalanche-sink-delta = { path = "crates/data-avalanche-sink-delta" }
data-avalanche-source-pg = { path = "crates/data-avalanche-source-pg" }
data-avalanche-source-mysql = { path = "crates/data-avalanche-source-mysql" }
data-avalanche-telemetry = { path = "crates/data-avalanche-telemetry" }
data-avalanche-cluster = { path = "crates/data-avalanche-cluster" }
data-avalanche-api = { path = "crates/data-avalanche-api" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
object_store = { version = "0.14.2", features = ["aws", "gcp", "azure"] }
tokio-postgres = "0.7"
mysql_async = { version = "=0.37.1", default-features = false, features = ["default-rustls", "binlog"] }
# The MySQL source (roadmap §2.1): the binlog events mysql_async reads, zlib for MariaDB's
# compressed events (Q-M7a-5), and the DDL classifier's parser (MySQL_DDL_Classifier §5; without
# `recursive-protection`, whose stack growth builds C code: the parser's recursion limit bounds it).
mysql_common = { version = "=0.37.3", default-features = false }
flate2 = "1"
sqlparser = { version = "=0.62.0", default-features = false, features = ["std"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
humantime = "2.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "env-filter"] }
rustls-pki-types = { version = "1", features = ["std"] }
blake3 = { version = "1", default-features = false, features = ["std"] }
getrandom = { version = "0.3", default-features = false, features = ["std"] }
tempfile = "3"
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# One arrow major workspace-wide (roadmap §2, D-MS.14): 59, as deltalake 1.0 resolves it.
arrow-array = "59"
arrow-buffer = "59"
arrow-row = "59"
arrow-schema = "59"
arrow-select = "59"
arrow-cast = "59"
# The Delta sink (roadmap §2.1). `deltalake` asks for `deltalake-core = "1.0"`, which resolves to
# 1.1; the direct pin keeps the engine the probes ran on (delta P1–P10, 2026-09-26).
deltalake = { version = "=1.0.0", default-features = false, features = ["datafusion", "rustls", "s3", "gcs", "azure"] }
deltalake-core = { version = "=1.0.0", default-features = false }
url = "2"
# The PostgreSQL source (roadmap §2.1): the replication transport the S-PG probes ran on (the
# pgoutput decoder is ours), and rustls for the catalog connection.
pgwire-replication = { version = "=0.4.1", default-features = false, features = ["tls-rustls", "scram", "md5"] }
tokio-postgres-rustls = "0.14"
webpki-roots = "1"
# The binary's control plane (M6b): metrics (roadmap §2.1).
prometheus-client = "=0.25.1"
gethostname = "1.1"
clap = { version = "4.6.7", features = ["derive"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
# The management API (M9a, roadmap §2.1): TLS on the listener, on the workspace's rustls.
tokio-rustls = { version = "0.26.5", default-features = false, features = ["aws_lc_rs", "tls12"] }
# Its auth (config §6.3): JWT verification on aws-lc-rs, the JWKS and OIDC discovery fetched with
# the reqwest object_store already builds, and basic auth's decode and constant-time compare.
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
base64 = "0.22.1"
subtle = "2.6.1"
# Its OpenAPI document (roadmap §4 M9), built from the route table with the builders. 6.0.0
# doesn't build without `macros`: its schema module names a type only that feature defines.
utoipa = { version = "=6.0.0", default-features = false, features = ["macros"] }
# The cluster (M8a, roadmap §2.1): the ring's hash (the anchor's `hash_algo: xxh3`); the SWIM
# core the gossip drives (Q-M8-1, probe `prototypes/cluster-capability`) and its random source;
# the host's addresses, for an unset `advertise_addr`.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
if-addrs = "0.15"
foca = { version = "=2.0.0", default-features = false, features = ["std", "serde", "postcard-codec"] }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "sys_rng"] }

# Dependencies build without debug info: DataFusion's full debug build is over 6 GB, which fills
# CI runners. Workspace crates keep it.
[profile.dev.package."*"]
debug = false
