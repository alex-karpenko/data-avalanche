[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["prototypes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
data-avalanche-core = { path = "crates/data-avalanche-core" }
data-avalanche-config = { path = "crates/data-avalanche-config" }
data-avalanche-testkit = { path = "crates/data-avalanche-testkit" }
data-avalanche-storage = { path = "crates/data-avalanche-storage" }
data-avalanche-state = { path = "crates/data-avalanche-state" }
data-avalanche-pipeline = { path = "crates/data-avalanche-pipeline" }
data-avalanche-sink-delta = { path = "crates/data-avalanche-sink-delta" }
data-avalanche-source-pg = { path = "crates/data-avalanche-source-pg" }
data-avalanche-source-mysql = { path = "crates/data-avalanche-source-mysql" }
data-avalanche-telemetry = { path = "crates/data-avalanche-telemetry" }
data-avalanche-cluster = { path = "crates/data-avalanche-cluster" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
object_store = { version = "0.14.2", features = ["aws", "gcp", "azure"] }
tokio-postgres = "0.7"
mysql_async = { version = "=0.37.1", default-features = false, features = ["default-rustls", "binlog"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
humantime = "2.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "env-filter"] }
rustls-pki-types = { version = "1", features = ["std"] }
blake3 = { version = "1", default-features = false, features = ["std"] }
getrandom = { version = "0.3", default-features = false, features = ["std"] }
tempfile = "3"
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# One arrow major workspace-wide (roadmap §2, D-MS.14): 59, as deltalake 1.0 resolves it.
arrow-array = "59"
arrow-buffer = "59"
arrow-row = "59"
arrow-schema = "59"
arrow-select = "59"
arrow-cast = "59"
# The Delta sink (roadmap §2.1). `deltalake` asks for `deltalake-core = "1.0"`, which resolves to
# 1.1; the direct pin keeps the engine the probes ran on (delta P1–P10, 2026-09-26).
deltalake = { version = "=1.0.0", default-features = false, features = ["datafusion", "rustls", "s3", "gcs", "azure"] }
deltalake-core = { version = "=1.0.0", default-features = false }
url = "2"
# The PostgreSQL source (roadmap §2.1): the replication transport the S-PG probes ran on (the
# pgoutput decoder is ours), and rustls for the catalog connection.
pgwire-replication = { version = "=0.4.1", default-features = false, features = ["tls-rustls", "scram", "md5"] }
tokio-postgres-rustls = "0.14"
webpki-roots = "1"
# The binary's control plane (M6b): metrics (roadmap §2.1).
prometheus-client = "=0.25.1"
gethostname = "1.1"
clap = { version = "4.6.7", features = ["derive"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }

# Dependencies build without debug info: DataFusion's full debug build is over 6 GB, which fills
# CI runners. Workspace crates keep it.
[profile.dev.package."*"]
debug = false
